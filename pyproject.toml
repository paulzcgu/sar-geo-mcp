# 0.31.8: an urban assignment's polygon holds the houses its counts hold.
# WHAT WAS WRONG: 0.30.0 made a group whose every block lies inside a
# larger group's outline join that group, but only when nothing at all was
# left: a block standing in another block's slot, 2 m proud of its mouth,
# came back as an assignment of its own drawn as the 2 x 14 m strip outside
# - area_ha 0.0, a DRAFT for a team, carrying every parcel, building and
# marker of the block - while 96 % of its ground and every house was drawn
# inside the larger group's polygon and left out of its counts; flush with
# the mouth it joined, so centimetres flipped it (PR #4 review B16). The
# same cut drew part of any block a larger outline's closing reached in
# that group's polygon while the block was counted in its own, and a block
# hemmed by two groups was counted in one and drawn in the other (B33).
# WHAT CALLERS SEE NOW: `group_blocks`, and so urban_assignments,
# plan_urban_search's urban section and their CalTopo drafts, draw every
# block wholly inside the assignment that counts it and no other. A group
# more than half of whose block ground the larger groups' outlines reach,
# together, joins the one reaching most of it (on a tie the larger),
# counted and drawn there, the part proud of the mouth too; one half
# reached or less keeps its blocks whole, the larger outline going round
# them. No assignment is a sliver of no area carrying houses. A hemmed
# group that was paired across water brings its partner, and the strip
# only when the partner would otherwise be cut off - an isle across the
# water: the host then counts that water link and carries its warning.
# Two partners both inside the host's outline take no strip, as before. A
# hemmed join is not held to the 140 % ceiling every merge keeps to - it
# never was - and now joins more often: an assignment it carries past the
# ceiling names the blocks in its warnings. A block under a square metre
# is drawn in its own outline, not folded into the largest group. An
# urban set already saved on staged ground is read back as it was
# (`reused`) until the ground is staged again or the parameters change.
# NOT CHANGED: every tool's input and output schema and description, the
# merging and water-pairing rules before the outlines are drawn, the
# street ground two outlines reach going to the larger group, a group
# wholly hemmed joining the group drawn round it with the outline drawn as
# before, and every grouping in which no outline reaches another group's
# block - nearly every town.
# 0.31.9: evict_cache holds the elevation tiles staged ground actually
# rests on. WHAT WAS WRONG: `tiles_in_use` worked out each staged
# directory's tiles at the level its extent takes with the default 1,024 px
# raster, but ground staged at a chosen resolution can be fetched at
# another level, and plan_medevac and plan_initial_response stage that way
# on every call: the landing-zone ground at 2 m, egress and rings at 10 m.
# Which ground lands on another level turns on its radius and latitude.
# The default 1,000 m landing-zone ground does at nearly every latitude
# (at 37.4 N it is fetched at level 16, where the default size gives 15).
# At 37.4 N, 10 m ground does below about 2,700 m round (level 14, where
# the default size gives 15 or 16): rings for shorter ring_minutes
# ([15, 30] stage 2,000 m), or a smaller egress_radius_m. Egress at its
# default 3,000 m and rings at their default 4,499 m share the default
# level there, but not everywhere: egress differs south of 30 N and
# between about 56.5 and 64.5 N, rings between about 53.5 and 56.5 N.
# evict_cache with `execute` could delete every elevation tile under such
# ground while reporting protected_by_staged_assignments 0, against its
# promise that tiles staged assignments rest on are never removed. The
# handle kept its own dem.tif, but a later re-stage of that ground on a
# laptop with no signal failed (PR #4 review B3).
# WHAT CALLERS SEE NOW: `stage_terrain` records in the manifest the raster
# size it asked `fetch_dem` for (`dem_width_px`, `dem_height_px`), and
# `tiles_in_use` holds the tiles at the level that size picked - for
# assignments, prepare_area and every scenario alike - so evict_cache
# neither offers nor removes them, and counts them in
# protected_by_staged_assignments. A directory staged before this has the
# size worked back from its `dem_resolution_m` and `latitude_deg`; over an
# extent taller than wide that can hold a second, adjacent level as well
# (about one such directory in 600), never one fewer. A recorded size no
# staging could have asked for is ignored and the size worked back
# instead. A manifest that gives neither a credible size nor a credible
# resolution and latitude is held at the default size, as every directory
# was before. NOT CHANGED: every tool's input and output schema and
# description, which tiles staging fetches, every staged raster and every
# number computed from one, eviction's ranking and ceiling, the
# vegetation, road and basemap tiles and the elevation mosaics
# (`dem_*.tif`) still not held, and the errors tiles_in_use raises on a
# malformed bbox_3857 (B25). One side effect, not a fix of B25: a
# bbox_3857 of fewer than four entries in a manifest that records its
# raster size, as every manifest from 0.31.9 does, is now skipped instead
# of raising.
# 0.31.10: point_in_geometry's distance_to_boundary_m is ground metres in
# every direction, to the nearest edge. WHAT WAS WRONG: the distance was
# planar degrees times 111,320 m x cos(latitude), right east-west only, so
# north-south it read short by cos(latitude): 222 m inside a north edge at
# 37.4 N read 177 m, the test square's "outside" case 3,330 m read 2,651 m,
# and at 60 N 223 m read 111 m. It measured a Polygon to its outer ring
# alone, so a point in a 200 m hole read 884 m from the boundary when the
# hole's edge was 88 m away, and any other geometry to the shape itself,
# so a point deep inside a MultiPolygon read 0.0 m - on the line. Latitude
# 95 read -558,651 m, and a NaN latitude from a direct call read NaN,
# which is not JSON (PR #4 review B4; the code predates the PR, moved from
# server.py).
# WHAT CALLERS SEE NOW: the distance is measured in an azimuthal
# equidistant projection centred on the point, to every ring of a polygon
# - a hole's and every part's - cut into pieces of 0.001 degrees, so it is
# true WGS84 ground metres whichever way the edge lies, a point inside a
# MultiPolygon reads how far inside it is, and a point in an inholding
# reads its distance to the inholding's edge. A latitude outside -90..90
# or a longitude outside -180..180, or one that is not a number, is
# refused naming the coordinate in the words the scenarios use ("latitude
# must be a number within -90..90; got 95.0"), asking whether the
# longitude was passed as the latitude only when the pair swapped would
# be on the globe. Refused too, each in its own words, where a wrong
# figure was answered before: a geometry with no coordinates
# ("coordinates": []), one with a coordinate that is not a number, and
# one with a latitude past a pole, which names that latitude. The
# measurement lives in the new `geo.distance_to_boundary_m`; nothing else
# in the server measured the old way, so no other tool's answer moves.
# NOT CHANGED: every tool's input and output schema and description, the
# `inside` answer (holes and parts were already respected), a line or
# point geometry measured to itself, and a line whose positions are all
# one place to that place (in ground metres now too),
# boundary_clearance and its own distance_to_boundary_m, and the error a
# geometry that will not parse raises, `{}` among them (B47).
# 0.31.11: a candidate set made under one norms file is never read back
# under another, and a corrected `public` reaches every later map read.
# WHAT WAS WRONG: a set id hashed the call's parameters and, of the norms,
# only hasty's corridor widths, so a server restarted with another
# agency's --norms over the same cache read back the old corpus's sets as
# current (`reused` true): hasty lines carried flags read against the old
# length, width and area bands, and urban assignments whose `target_ha`
# was left to the norms stayed grouped toward the old median, their
# `target_source` still calling it "corpus median for GROUND" while
# assignment_norms on the same server gave the agency's (PR #4 review
# B23; the ids predate the PR, whose plan_initial_response and
# plan_urban_search read the sets back). And the area key hashes the map
# id but not `public`, so a call on a private map corrected from
# public=True to public=False was answered "already staged" while every
# later read of the map, each scenario section's among them, still went
# through the public endpoint and failed: the hasty overlap was lost,
# with a warning, beside a staging record whose own read had worked. The
# scenarios take no `force`, so only a direct prepare_area(force=True)
# got out of it (B49; inherited from prepare_area). prepare_terrain,
# answering "already current", kept the old path the same way.
# WHAT CALLERS SEE NOW: hasty_candidates' set parameters carry
# `norms_digest`, a hash of the server's norms, and urban_assignments'
# do when `target_ha` is left to them, so under another norms file the
# set is made afresh under a new id, `reused` false - in
# plan_initial_response and plan_urban_search too - flagged against the
# new bands and grouped toward the new median. Every such id changed once
# with this release: a set saved before is measured again on its first
# call, and an id already held still names the set it named, as it was
# measured then under the norms of that time (the README says so).
# Populated blocks, which no norm decides, are still read back.
# prepare_area and prepare_terrain answering from ground already staged
# record the path the call has just read the map by, in `access.json`
# beside the manifest, and every later read of the map goes that way: the
# corrected call's sections read the private map, and nothing is staged
# again. Only a path that worked is recorded: a later call leaving
# `public` at its default true on a private map says in its warnings that
# its own read failed, as before, and the handle keeps reading the map by
# the path recorded before it. A re-stage writes a manifest holding its
# call's path and removes the file. hasty_candidates' description now says
# the same parameters give the same set id under the same assignment norms.
# NOT CHANGED: every tool's input and output schema, every other
# description, the manifest (rewriting it would have reported every set
# on the handle as made before a re-stage), the ids of urban sets given a
# `target_ha` and of every set no norm decides, the map-version check on
# hasty sets, and the path a first stage records.
# 0.31.12: parse_coordinate reads a hemisphere letter before the number.
# WHAT WAS WRONG: a letter was read only after the number, so the form
# many GPS units display - "N37°56.324' W122°00.092'", "N 37° 56.324'
# W 122° 00.092'", "N37.93873 W122.00153" - came back parsed false, "not a
# recognisable coordinate", in every format, near point or not. Found
# writing the HTML guide's examples. A person reading the screen aloud
# had to be asked to say it another way.
# WHAT CALLERS SEE NOW: `coords.parse_angle` takes the letter before the
# number as it takes it after, and `parse_pair` splits a letters-first
# pair with no comma before its second letter, so these forms parse to the
# same point, longitude first as well ("W122.3151 N37.4244"). A letter on
# both sides of one value ("N37.4244N") is refused, not one of them
# believed, as is a letters-first pair whose second value has no letter
# and no comma ("N37.4244 122.3151"), where the split cannot be told.
# parse_coordinate's description says the letter may come before or after.
# NOT CHANGED: every form that parsed before, the grid formats, every
# tool's schema, and a sign the letter contradicts ("E-122", like
# "-122 E"), where the letter wins as it always has.
# 0.32.0: egress stays on the trails once on one, and a litter that
# cannot leave a steep spot is carried from the nearest ground it can.
# WHAT WAS WRONG: a medevac from a point 112 m above the Pacific Crest
# Trail at a test point beside a backcountry lake drew two walk-outs that left
# the PCT for ~200 m across the slope - one to a 4x4 road track,
# one to a campsite track stub - to save 1.2 and 0.6 minutes over trails
# that reached the same roads. Egress was least time alone, and off a way
# was only Tobler's 0.6 times vegetation, so any shortcut a little over
# half the trail's way round won. The litter's carry-out drew nothing:
# the point itself reads 66 degrees on both elevation models, so it was
# "rope or helicopter" and no more, and the hiker's lines were the only
# ones on the map. Neither the lines nor the scenario said a metre was off
# trail: the warning needed over half, and the scenario dropped
# off_trail_m.
# WHAT CALLERS SEE NOW: `egress_routes` solves in two stages
# (`egress_graph.solve_staying_on_ways`): free to the first mapped way,
# then a step off every way counts 1 / `leave_way_factor` times over in
# choosing the route (new, default 0.1, in (0, 1], 1 turns it off; an
# exit's own cells never count over). `minutes` stay walking minutes.
# A carry-out stuck on its location now starts each exit's carry from the
# nearest cell, by the elevation model without the grade limit, from
# which a litter reaches that exit; the exit gains `litter_start` {point,
# distance_m, bearing_deg, drop_m, direction} (null otherwise) and a
# warning that a rope evacuation gets the patient there. Only when no
# such cell exists is the reason still a rope evacuation or a landing
# zone. The scenarios' compact exits gain `off_trail_m`, `on_trail_share`
# and `litter_start`; a summary's quickest exit gains `off_trail_m` (and
# `litter_start` when set); every route line with any ground off a way
# says how many metres. At that point the walk-outs are now 55.5 and 39.2
# min with only the 239 m down to the PCT off trail, and the carry-outs
# start 125 m SE, 11 m lower, 64 m off trail.
# NOT CHANGED: the movement model, travel rings, a route that never
# touches a way, the exit masks, and every other tool.
# 0.33.0: a medevac follows its trail off the edge of the ground, belays a
# litter down a steep pitch of trail, walks a patient the maps put in a lake
# ashore, and grades landing zones out to the edge of the staged buffer.
# WHAT WAS WRONG: a test medevac at a backcountry lake drew a
# walk-out and carry-out that cut 3.6 and 9.2 km cross-country to a 4x4
# track: the lake's trail ran off the east edge of the 3,000 m exit ground
# before its trailhead, and nothing said so. The walk-out alone said the
# ground was cut off: the patient, 5 m from the shore, stood in cells the
# 30 m land cover and the shoreline read as lake, and so did every
# neighbour. With the ground widened by hand, the carry still left the
# trail for 150 m round a pitch steeper than its 40 % step limit, which
# applied on the trail too. And a marginal landing zone on that trail,
# 1,290 m out, was staged (the buffer reached 2,000 m) but never graded:
# only the 1,000 m circle was.
# WHAT CALLERS SEE NOW: `egress_routes` - a step along a mapped way (both
# ends on it) is exempt from the litter's per-step limit; each exit gains
# `steep_pitch_m` (metres of such pitch, null with no grade limit, and a
# belay warning) and `off_trail_after_joining_m`. When no exit is reached
# without leaving a trail for over 100 m after joining one and a trail runs
# off the edge, the answer gains `trail_beyond` {point, way_name, minutes,
# distance_m, bearing_deg, problems, recentre} and a warning; null
# otherwise. A walk-out whose own cell is closed opens the straight line to
# the nearest open ground and says so in `closed_start` and a warning.
# `lz_candidates` takes `whole_ground` (default false): every staged cell
# is graded, the tree check fetched over the whole raster, and
# `assumptions.searched` says which. `plan_medevac` grades its landing
# zones over the whole ground, and when a mode's `trail_beyond` is set it
# stages the exit ground once more, re-centred along the trail
# (`staging.egress_recentred`), asks again and keeps the answer more on
# the trails; the mode gains `trail_beyond` and `recentred`. At that lake
# the plan now finds the marginal zone 1,290 m east beside the trail, and
# both exits end at the trailhead lot: the walk-out 144.6 min,
# 9.1 km, 99.4 % on trail; the carry-out 575.7 min with no metre off trail
# after joining it and 28 m of pitch to belay.
# NOT CHANGED: a walk-out on open ground, a route that reaches a road on
# its trail, landing zones from `lz_candidates` called without
# `whole_ground`, and every other scenario.
# 0.34.0: plan_initial_response lists trails and roads alone as hasty
# candidates by default.
# WHAT WAS WRONG: at a test place last seen on a trail in a wooded
# open-space preserve the hasty section found 358 candidates, 323 of
# them ridge, drainage and waterway corridors, mostly 100-300 m pieces of
# wooded ground; the nearest 20 held one trail and two roads, and the
# export drew all of them as drafts. The ground's "a drainage / a
# ridgeline reaches the raster edge" warnings also came back on a set that
# held neither.
# WHAT CHANGED: the hasty section calls hasty_candidates with include
# ["trail", "road"] unless `overrides['hasty']['include']` is given; null
# there lists every axis as before, a list names the axes. The default is
# in the section's detail_call and is never reported as an unused
# override. A hasty `corridor_widths_m` with no corridor axis in the list
# gains a top-level warning. hasty_candidates drops a raster-edge warning
# whose axis is not in its include (boundary.EDGE_WARNINGS). On that ground
# the list is 35 lines: 7 trails, 28 roads.
# NOT CHANGED: hasty_candidates' own default (every axis), the other
# scenarios, and a set saved before this release, which is read back with
# the warnings it was saved with.
# 0.35.0: urban assignments keep each street whole, both sides, and miss
# no house.
# WHAT WAS WRONG: against a hand-drawn reference map of a small town the
# grouping merged any blocks that touched, toward 10 ha, so rows backing
# onto each other went to one team and a street's two sides to two (AS);
# lots chose their street from OpenStreetMap lines drawn 10-15 m off the
# parcels; a block the ring crossed was cut at the panel edge; runs under
# min_parcels (51 built lots there) and vacant lots were left out; the
# water pass paired touching groups and drew strips over houses.
# WHAT CHANGED: blocks merge along streets that join (street_links), into
# one piece; back-to-back only under 30 % of the target; lots vote from the
# right-of-way they touch; every block the ring reaches is kept whole (200 m
# panel margin, so the widest urban radius is about 3.9 km); short runs and
# small cut pieces join the block whose lots they touch; vacant lots
# touching their street's houses join it (`vacant_lots`); water pairs are
# more than a street apart and cross no block. Set ids carry `method`, so
# older sets are drawn again. At 2.5 ha the reference town gives 17 one-piece
# assignments, 4 built lots left out.
# NOT CHANGED: the default target (corpus median; `target_ha` sets it),
# arterials, and the hasty and other scenarios.
# 0.36.0: hasty_candidates lists trails and roads alone by default.
# WHAT WAS WRONG: 0.34.0 narrowed plan_initial_response's hasty list to
# trails and roads, but hasty_candidates called on its own still listed
# every drainage, ridge and waterway, hundreds of 100-300 m pieces on
# wooded ground that bury the walkable lines.
# WHAT CHANGED: `include` null now means ["trail", "road"]
# (corridors.DEFAULT_INCLUDE); name drainage, ridge or waterway to list
# them, all five for every kind (corridors.ALL_INCLUDE). The raster-edge
# warnings follow, so a default set carries neither. plan_initial_response's
# `overrides['hasty']['include']` null still means every axis, now passed
# as the five names, which is what its detail_call shows.
# NOT CHANGED: a set named with all five keeps its id (null then hashed to
# the same list); a set saved under the old default is not read back for a
# null call, which now hashes to trails and roads.
# 0.37.0: hasty_candidates no longer offers drainages or ridges.
# WHAT WAS WRONG: the drainage and ridge corridors traced off the elevation
# model were not stable or useful as hasty candidates: on wooded ground
# hundreds of 100-300 m pieces (on the preserve 323 of 358 candidates were
# corridors), and in developed ground they followed the street grid.
# WHAT CHANGED: `include` takes trail, road and waterway only (default
# trail and road); drainage or ridge is refused by the schema, and
# `corridor_widths_m` takes waterway alone. A waterway corridor is the
# mapped creek, clipped to the area, no longer matched against the DEM
# drainage network (`sources` is ["waterway"]). The ground's drainage and
# ridgeline raster-edge warnings are always dropped from a hasty set.
# plan_initial_response's `include: null` is now the three names. Set ids
# change, since the hashed widths cover waterway alone.
# NOT CHANGED: the ground still traces drainages and ridges, and
# describe_boundary, terrain_metrics, identify_features, debrief and the
# other tools read them as before. A set saved before this release is read
# back as it was saved.
# 0.37.1: urban search no longer drops houses folded into the street.
# WHAT WAS WRONG: in a downtown test area a row of small, fully roofed lots
# beside the place last seen was in no assignment. Read as condo-unit
# parcels, they were folded into the neighbour they share most edge with:
# the street right-of-way. Their roofs then kept the street from reading
# as street. A short run whose only neighbour was another short run was
# left out when that run joined a block after it.
# WHAT CHANGED: a unit parcel is never folded into right-of-way or ground
# over 10 ha (FOLD_PARENT_MAX_M2); with no other neighbour it stays a lot.
# Short runs join blocks in passes until none moves. The block method is 3,
# so saved sets are drawn again. The test area leaves no built lot out (was 3).
# Docs: the urban and plan_urban_search pages re-run on this release.
# 0.38.0: a Claude Desktop extension (extension/, dist/sar-geo.mcpb) for
# people who don't code. Its launcher runs the newest release from PyPI on
# every start, so a tag pushed here reaches every install on its next
# restart (.github/workflows/release.yml publishes it). NEW: the CalTopo
# credential can be given directly as ZA_CALTOPO_ID / ZA_CALTOPO_KEY /
# ZA_CALTOPO_ACCOUNT_ID instead of a cts.ini, and is then used in place of
# the file; `key_status` says which optional keys are set (never their
# values) and where to get each; `check_for_update` compares the running
# version with PyPI's newest. serverInfo now carries this package's
# version, not fastmcp's. Nothing existing changes.
# 0.39.0: files reach the person who asked for them.
# WHAT WAS WRONG: under the Claude Desktop extension a medevac export was
# reported as cache/staged/aoi-.../exports/medevac.geojson - relative to a
# folder inside Claude's own app data - and Claude could only tell the
# user to search their disk for it. The extension's Data folder setting was
# also ignored: Claude Desktop passed its default ${HOME}/SAR Geo through
# unexpanded, so everything was cached inside the extension's install
# folder, where a reinstall can delete it.
# WHAT CHANGED: the cache directory is always absolute (review B22, which
# its test now holds), with ~, ${HOME} and Claude Desktop's ${DOCUMENTS}
# placeholders filled. Under the extension, terrain is cached in the system
# cache folder (~/Library/Caches/sar_geo, %LOCALAPPDATA%\sar_geo\cache),
# not in Documents, which many people sync. NEW: `save_export` copies a
# file a tool wrote (an export GeoJSON, a chip) to ~/Documents/sar_geo/
# <chat folder> - the caller names the chat's folder, since the server
# cannot see which chat it serves; today's date otherwise - and shows it in
# Finder or Explorer. Only files under the cache can be copied. The folder
# is SAR_GEO_EXPORTS_DIR, the extension's "Exports folder" setting, and
# key_status reports it. Files already cached in the old place stay there.
# Docs: README.md is now for people using SAR Geo; AGENTS.md holds the
# developer guide and the architecture rules; docs/ keeps only the HTML.
# 0.39.1: the first public release, under the MIT license.
# WHAT CHANGED: LICENSE (MIT) added and declared. Comments, examples, test
# fixtures and messages no longer name real operations, people, teams,
# maps or places tied to a search: map IDs, track and assignment labels,
# dates and coordinates are made up, and the assignment norms keep their
# statistics without naming their source. Overpass requests now identify
# as sar-geo-mcp. The HTML guide is withdrawn until it is regenerated on a
# public demo map. Review B36 is fixed: a debrief answer no longer names a
# command-line tool or the server's cache path, and tracks that miss the
# assignment are refused with "check the team number, and that the track is
# from this assignment and on this map" instead of asking about a data
# directory the caller never chose. NEW: every GeoJSON file written for
# CalTopo (caltopo_export, the scenarios' files, unmarked_paths) puts all
# its features in one CalTopo Folder, "SAR Geo <what> <date time>", so an
# import lands as one group to move or delete; caltopo_export reports it as
# `folder`. CalTopo has no folder inside a folder, so a feature that already
# carries one is refused rather than nested. 0.38.0 and 0.39.0 were
# withdrawn from PyPI; this release replaces them.
# 0.40.0: urban assignments are bounded by streets, as a planner draws them.
# WHAT WAS WRONG: lot lines were read only 200 m past the search circle, so
# a street the circle reached was cut off in a straight line where that
# read stopped, half its lots missing. A street's run was never ended by a
# cross street - the closing spanned it - so a run the circle touched was
# kept on past cross street after cross street. The lots at a run's end
# that face the cross street were filed under it and dropped with it, so
# the edge stopped at a back fence short of the street. And each assignment
# stopped at its own back fences and kerbs, so the street between two
# neighbours was nobody's and their edges did not meet. WHAT CHANGED: a run
# is cut along every other named street's OpenStreetMap centreline (a lot
# goes whole to the piece holding most of it), so a block is a street both
# sides from cross street to cross street; a run the circle keeps takes the
# corner lots and the row facing its cross street when their own block is
# not kept. Edges snap to the streets: no ground is given across a
# centreline (a line of sight to the outline, so a dead end leaks nothing),
# so neighbours either side of a street meet on it; an edge or a notch
# facing a street is drawn out to it, straight ahead, with no finger along
# the street; a pocket or slit mostly surrounded by assignments, or the
# rest of a city block they mostly cover, goes to the nearest; a
# boulevard's median goes with the ground beside it; and every outline is simplified as one
# coverage, so a shared edge is one line. And: when a block the circle keeps runs
# into the edge of the lot lines read, they are read again twice as far
# out, up to the 1,000 m planning buffer and never at a coarser pixel; a
# block within a closing of that edge counts as running into it, since
# the next lot may be cut too thin to show its roof. `assumptions.margin_m`
# says how far they were read. Only streets with a lot within 200 m of the
# area are drawn, so the wider read costs less than its size, and lots left
# out far beyond the area are no longer counted. Ground between two
# assignments up to 90 m apart (`snap_gap_m`) with no street through it is
# split down its middle; an outer back fence facing no other assignment
# stays where it is. `area_ha` now includes the street ground taken. The
# block method is 4, so a set made by 0.39 is made again rather than read
# back. A call that has to read wider takes longer: half a mile across, 14
# to 32 s in four towns (a bayside suburb, a lagoon town, a hillside town
# and a lakeside one) rather than about 6.
# 0.41.0: areas are in acres.
# WHAT WAS WRONG: every area came back in hectares, a unit search planners
# in the US do not work in. WHAT CHANGED: every area a tool answers is in
# acres, and the names say so - `area_acres` (urban blocks and assignments,
# describe_boundary, hasty corridors, travel-time rings, buffer_geometry),
# `target_acres` (urban_assignments, plan_urban_search), and
# assignment_norms' `target_area_acres`, `polygon_area_acres` and
# `area_acres_by_resource`; an area norm flag is `area_acres`, banded in
# acres, and CalTopo descriptions say acres. The old names are gone: a
# script or override passing `target_ha` must pass `target_acres`. The
# corpus file keeps its hectares, so another agency's file is written as
# before, and is converted where an answer is written. Urban sets are named
# by `target_acres` now, so each is made once afresh.
# 0.42.0: unmarked_paths reports what the agencies have on record; DEM
# benches are experimental and off by default; BLM routes are read again.
# WHAT WAS WRONG: run on four public-land areas, the terrain source's
# "benches" were mostly not roads: 82-99% of them sat on a ridge crest or
# in a channel, because the bench test - ground flatter than the slope
# around it - fires there as readily as on a cut road, and on 6.3 m ground
# a 4 m road tread is under one pixel. The imagery check made it worse: a
# bare strip counted as a second, independent sighting, so a dry creek bed
# under a channel "bench" came back `corroborated` and ranked first. And
# BLM had retired the `BLM_Natl_GTLF` service the `blm` source read, so it
# failed with a 404 everywhere and BLM land had no agency record at all.
# WHAT CHANGED: with no `sources` named, unmarked_paths reads the Forest
# Service, BLM and USGS inventories and checks each line against NAIP
# imagery; `terrain` is read only when named, and every call that reads it
# carries a warning that it is experimental. `imagery.bare` is now a check
# reported on each line and never a sighting: it changes no tier and no
# order. A caller who wants the benches back passes `terrain` in
# `sources`; a bench on bare ground now stays `terrain_only`. The `blm`
# source reads `BLM_Natl_GTLF_Public_Display`, all eight layers: a route's
# kind (road or trail) and what it is managed for come from its layer
# (`detail.managed_for`), and a route managed for limited public motorized
# use, or not assessed for public use, says so in `status` beside any
# access restriction BLM records ("Unknown" and "All" are no restriction).
# The agency cache's query version is now 2, so ground staged before
# fetches its agency records once more. The public display is not known to
# carry routes BLM has designated closed.
# 0.42.1: two answers no longer give out-of-date advice.
# WHAT WAS WRONG: coverage_for's warning for a line assignment with no
# saved metrics told the caller to "pass --corridor-width", a command-line
# option no tool takes, and debrief_assignment added a note apologising
# for it. plan_urban_search's description said lot lines were read only
# 200 m round the search circle, which has not been true since 0.40.0.
# WHAT CHANGED: the coverage warning names only the `terrain_metrics`
# tool, and the debrief note about the option is gone. The description
# says lot lines are read 200 m round the circle, then twice as far again
# while a kept block runs into the edge, up to 1,000 m past it. Nothing
# else changes.
version = "0.42.1"
description = "CalTopo interaction hub and geo-computing accessories for SAR"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Caps are deliberate, carried over from the original project
    # from: this is infrastructure for field laptops, not a library chasing
    # the latest of everything.
    "caltopo-python>=2.0.0,<3",
    "pydantic>=2.7,<3",
    "pyproj>=3.6,<4",
    "shapely>=2.0.2,<3",
    "httpx>=0.27",
    "numpy>=1.26",
    # Imported by caltopo/wms.py since 0.5.3 and by planning/rasters.py, and
    # arriving transitively until now. Both raster tools decode and draw with
    # it, so it is declared rather than borrowed.
    "pillow>=10.0",
    # 1.4 is the first release built against numpy 2; rasterio 1.3.x imports
    # fail with "numpy.core.multiarray failed to import" under numpy>=2.
    "rasterio>=1.4",
    "pysheds>=0.5,<1",
    "scipy>=1.11,<2",
    # The centreline skeleton in terrain/lineaments.py. Already arriving
    # with pysheds, which requires it; declared because this package now
    # imports it directly, the same reasoning as pillow above.
    "scikit-image>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
# The MCP server itself (Phase B3). Kept optional so a consumer that only
# wants the library - which is every consumer today - does not pull a
# server framework it never starts.
mcp = ["fastmcp>=3,<4"]

[project.scripts]
# The stdio entry point an MCP client launches. Only useful with the [mcp]
# extra installed; without it the import fails with fastmcp's own message,
# which names the missing package.
sar-geo-mcp = "sar_geo_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The LANDFIRE vegetation lookup (sources/data) ships with the code. Learned the hard way
# in an earlier project: an editable install reads straight from src/, so a
# missing package-data entry stays invisible until a real wheel is built
# and something fails at runtime.
# The assignment-anatomy norms (planning/norms.py) ship the same way, for
# the same reason.
sar_geo_mcp = ["sources/data/*.csv", "planning/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real network services; requires credentials",
]
# --strict-markers turns a misspelled marker into a collection error.
# Without it, `@pytest.mark.livee` silently runs in the default suite,
# defeating the whole point of keeping credentialed network calls out of it.
addopts = "-m 'not live' --strict-markers -ra"

# original tools' descriptions, which tracks a team number selects, the
# plainly named preference and its fallback, every number computed from
# the tracks chosen, the server log's lines, the order of the other
# coverage warnings, and the coverage warnings of team numbers whose every
# matched line is plainly named, with none set aside that reaches the

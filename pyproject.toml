[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-geo-mcp"
# Bumped when the surface consumers depend on changes. The app pins a
# floor against this, so an out-of-date sibling checkout fails at install
# with a resolver message rather than at runtime with an ImportError.
# 0.4.0 is planning phase 1: area handles, the ridge kind, the OSM barrier
# and water-edge classes, the norms file, and describe_boundary. 0.5.0 is
# planning phase 2: hasty candidates, get_candidate, per-candidate effort;
# describe_boundary takes a candidate id. 0.5.1 adds Tile.from_slippy, so a
# tile proxy can translate a Leaflet z/x/y address onto the hub's grid.
# 0.5.2: from_slippy bounds the level.
# 0.5.3: unique temp files in tile and panel writes.
# 0.5.4: Overpass retries, mirrors and an honest failure.
# 0.6.0: travel time from the centre on every candidate; min_length_m.
# 0.7.0: a named way is one candidate, drawn to its ends - one line
# candidate per class, name and connected component, its length_m the total
# inside the area, its geometry a MultiLineString when it forks, and a new
# facts.branches counting the pieces.
# 0.8.0: line candidates run to the edge of the measured ground, not the
# search circle - a line's length_m and geometry cover the staged raster (the
# area plus a 1,000 m planning buffer, up from 500 m), a new
# facts.clipped_at_edge says when the way carries on past that ground, and the
# buffer is part of the area handle so a directory staged with the old one is
# never re-used at the smaller size. Corridors still clip to the subject area.
# 0.8.1: clipped_at_edge is also true when a way ENDS on the raster boundary.
# The staged osm.json is already cut to the staging box, so on a real staging
# a length comparison alone flagged nothing - not even a road running tens of
# kilometres past the ground. Found by a live check against v0.8.0, which
# nothing but this repository's own tag consumed.
# 0.8.2: every cache writer uses a unique temp file. The temp name used to
# be derived from the destination, so two threads writing one cache key
# wrote the same `.part` path: an operator got a PermissionError on the
# FIRST click of every session - the PLS echo and the staging thread both
# caching the same map onto `TESTMAP.json.part` - and success on the
# second, once the cache was warm. `caltopo/wms.py` had solved this for
# tiles in 0.5.3; that fix now lives in `cache.atomic` and all seven
# writers use it. No caller's behaviour changes.
# 0.9.0: `buffer_geometry`, a stateless tool that widens a line into the
# polygon CalTopo's Buffer draws - `distance_m` ground metres each side,
# round ends. The planning agent exports a line search as such a ribbon
# (15 m each side, which is CalTopo's default and what every line search
# on real team maps measures), and it holds no geometry maths of its
# own, so the buffer lives here. New tool only; nothing existing changes.
# 0.10.0: `buffer_geometry(single_ring=True)` draws a ribbon that encloses
# ground as ONE ring per polygon, the holes cut open along zero-width
# bridges. Found by the first live CalTopo import: a loop trail
# closes into a loop, its buffer is a donut, and CalTopo carries one ring
# per polygon - it dropped the hole and imported an 8.36 ha area of
# hillside where a 4.91 ha corridor was planned. The area is measured
# before the cut and does not change; the default is off, because a
# self-touching ring is invalid to everything except the one-ring model
# that needs it. Nothing existing changes.
# 0.15.0: `prepare_area(...)["osm_available"]`, a FIELD saying whether
# OpenStreetMap could be read, so the app stops inferring it by matching
# warning prose against a hub constant - a comparison that silently stopped
# being true whenever the warning was reworded. Also the Overpass mirror
# list stops claiming a depth it never had: `overpass.kumi.systems` was a
# CNAME of `overpass.private.coffee`, so three names were two machines, and
# a hung host could spend a whole 90 s budget under both of its names while
# the one working mirror sat untried. The budget is now shared across the
# mirrors not yet tried, and a timeout abandons a host after one attempt
# instead of three. Callers gain a field; nothing existing changes.
# 0.16.0: `lz_candidates`, where a helicopter can put down - open, flat
# patches on staged ground graded preferred, minimal or marginal the way
# the CalTopo First Response safety course grades a landing zone, each
# pocket on its own ground, with the nearest power line (or "unknown",
# never a silent null), an imagery chip per candidate named by its ground,
# and no aspect or bearing where the ground has none. Staged route records
# gain a `power` property so a wire can be told from a fence; a record
# without the key predates the field and reads as unknown. The canopy
# panel is fetched through the WMS path when an area handle lacks it, and
# refused when it cannot be. Callers gain a tool and a field; nothing
# existing changes.
# 0.17.0: `lz_candidates` closes ground before any circle is fitted, not
# just reports it after - within 30 m of a structure CalTopo has mapped
# (`structure_clearance_m`, on CalTopo's `structures` layer: footprints are
# drawn semi-transparent, alpha 64 to 127, never opaque, so the alpha
# threshold is 32, not 128) and within 60 m of any mapped power line, now
# including distribution lines (`powerline_clearance_m`; OSM query version
# 4 asks for `power=minor_line` as well as `power=line`, and every cached
# tile is fetched again once to pick them up). A structures layer that
# cannot be had is a warning, not a refusal - the filter is lost, not the
# grade. The imagery chip becomes a list, one per source that could be had:
# CalTopo imagery and NAIP as before, then Mapbox and Google static
# satellite images when the server is configured with their keys
# (`ZA_MAPBOX_TOKEN`, `ZA_GOOGLE_MAPS_KEY`); `chip_path` still names the
# first. httpx's own request logging is quieted on import, because a
# CalTopo GetMap URL carries the account token in its path and a Mapbox or
# Google static-image URL carries its key in the query string, and an INFO
# line is a published credential. `shaded_relief` and `slope_shading`
# carry the same fix on their own CalTopo panel fetch: a failed fetch is
# now a warning naming the exception type and, for an HTTP error, its
# status - never the message, which is the URL and the token in it.
# Callers gain parameters and fields; `chip_path` still names the first
# chip. One field goes: `assumptions.chip.layer`, since chips no longer come
# from one layer - `assumptions.chip.sources` lists the sources asked, and
# each candidate's `chips` list says which chips exist.
# 0.17.1: warnings a planner now reads on the app's Safety page. An
# "osm unavailable" outage recorded at staging is no longer returned once a
# top-up has written an osm.json (`osm_refreshed_versions`), at any version
# (a file that is merely behind is reported by the top-up's own warnings);
# a successful top-up moves it to a new manifest list,
# `osm_retired_warnings`, that only grows, so the staleness stamp still
# always changes. An outage beside a file no top-up wrote stands in an
# assignment directory (its boundary can move), not in an area's. "Exists"
# is made to mean "fetched for this ground": a re-stage that cannot reach
# Overpass keeps the earlier osm.json only for the same bbox, with a new
# kept-file warning in that staging's response in place of the outage, and
# removes one fetched for another bbox. An unparseable osm.json is fetched
# again instead of failing prepare_area, and removed when it cannot be; a
# removal that fails raises without the path. No warning carries a
# path, a URL or a credential: an OSM failure names the exception type
# (and an HTTP error's status) through `net_errors.safe_reason`; only
# OverpassUnavailable keeps its hub-written sentence, which names the last
# host alone. Endpoints are reported as host[:port] everywhere, including
# `assumptions.overpass_endpoints` on a routes result, which changes from
# URLs to hosts. New in `staging`: OSM_UNAVAILABLE, osm_outage_warning,
# is_osm_outage_warning, OSM_REFETCH_FAILED, osm_kept_warning,
# is_osm_kept_warning, manifest_warnings; in `terrain.linear`:
# reported_endpoints.
# 0.18.0: a new tool, `egress_routes` - the quickest exit a 2WD vehicle can
# reach and the quickest a 4x4 can, from a location, on foot (`walk_out`) or
# by litter (`carry_out`), by least walking time that counts the climb
# (Tobler on the signed grade, faster on mapped ways, a litter's 40 % grade
# limit), both kinds always returned, each with its route, minutes,
# distance, climb, descent, and the road, lot and gates it ends on; gates
# and access are said, never excluded, and the minutes are a rank, not a
# promise. `lz_candidates` gains `road` (the nearest road, track or other
# vehicle way within the notice distance, `on_road` when it comes within the
# clear circle - "within the whole clearing"), `parking_lot` and
# `assumptions.road_class`; its missing-OSM warning gains a sentence, the
# first kept word for word. OSM query version 5 keeps `highway`, `access`
# and `tracktype` on every route and fetches gates into a `gates` list, so
# every cached tile and every staged area is fetched once more on its next
# staging, and a top-up names every group an old file lacks. Callers gain a
# tool and fields; no field is removed or renamed. Wording changes: the
# warnings said above; a staged directory's grid errors now name the missing
# or unreadable file and never its local path (a corrupt manifest or subject
# file raises OSError where it raised ValueError; every hub caller catches
# both); and a stored `power` tag is lowercased like the other way tags.
# 0.18.1: three tools that could not run over MCP alone now can. Nothing
# in this package wrote `terrain_metrics.json`, the file `slope_stats`,
# `elevation_profile` and `coverage_for` read - only the debrief app did -
# so `terrain_metrics` now saves what it computed beside the staged ground,
# and `stage_terrain` and a successful `refresh_osm` remove it (new:
# `staging.discard_terrain_metrics`), since metrics measured from the old
# polygon or the old osm.json would answer for ground that has gone.
# `coverage_for` crashed on every real call ("'CoverageResult' object is
# not iterable") and now returns the `CoverageMetrics` digest, never the
# track geometry. Wording: the missing-metrics errors and the line-coverage
# fallback warning name the `terrain_metrics` tool first and still name
# the debrief app's own command. No field is removed.
# 0.19.0: a new tool, `populated_areas` - urban and suburban search blocks
# read off CalTopo's parcel layer (new WMS layer `parcel`, resampled with
# MAX_ALPHA like `structures`): built-up lots, at most an acre, grouped by
# the OpenStreetMap street they front into one block per street (both sides
# and the street between), plus one block per big lot that is mostly roof.
# Saved as a candidate set of a new kind, `block`; `get_candidate` returns
# the polygon. Opt-in `building_markers` adds one CalTopo house marker
# (`hut`, white by default, `marker_color` to change it) per building,
# returned with the block by `get_candidate`; `Candidate` gains an optional
# `markers` field, left out of summaries and out of `get_candidate` for
# every candidate that has none. Callers gain a tool; nothing existing
# changes.
# 0.20.0: urban search, end to end. Two new tools: `urban_assignments`
# merges populated blocks into assignments of about one size (the corpus
# median for `resource_type`, 10 ha for GROUND, or `target_ha`), never
# across an OSM arterial, small groups pairing across water two at most -
# saved as a candidate set of a new kind, `assignment`; and
# `caltopo_export`, which writes any candidate set as a GeoJSON file CalTopo
# imports as DRAFT assignments (multi-part candidates split, holes cut open,
# the search area and house markers included) - a file beside the staged
# ground, never a write to CalTopo. `prepare_area` takes `radius` with
# `radius_unit` (m, km, ft, yd, mi) beside `radius_m`, the same ground under
# the same handle whichever names it, and returns the area's outline as
# `area`. `convert_coordinate` gains `degrees_minutes_seconds`; new
# `coords.format_dms`. `populated_areas` FIXES: no two blocks share ground
# (the street two closings both reached was drawn into both; nearest the
# centre now keeps it) and every block is one polygon (a run another
# block's lots cut in two was one MultiPolygon; it is now two blocks, each
# with its own lots and a warning) - so block counts, names' run numbers
# and areas change slightly on ground where either happened. Callers gain
# two tools and fields; no field is removed.
# 0.21.0: a new tool, `travel_time_rings` - rings of equal walking time
# round a place last seen, the travel-time counterpart of a radius circle.
# One solve of egress's walking graph outward from the location, cut at each
# time asked for: Tobler on the signed grade; off a way, Tobler's 0.6 times a
# LANDFIRE lifeform factor (brush slowest); a fixed time to get into a creek;
# rivers, shores and open water closed but at a mapped crossing; ground over
# the cliff slope closed off a way. Each ring carries its polygon, outline,
# area, equal-area radius and reach in eight directions - each with the
# quickest route there, its minutes on and off trail, the trail walked and
# where it was left - and says when the staged edge cuts it. `egress_graph.build_graph` gains two optional
# arguments (`off_way_scale`, `crossing` with `crossing_minutes`); egress
# passes neither and is unchanged. Route records gain `waterway` and
# `tunnel` (always written, null where absent; no query change - `out geom`
# already returned them); a record without them was staged earlier. Callers
# gain a tool and two route fields.
# Also in 0.21.0, ONE MOVEMENT MODEL: every walking number now lives in
# `terrain.movement` (Tobler, on-way 1.0, off-way 0.6, the LANDFIRE lifeform
# factors, the 45-degree impassable slope, the creek minutes), and every
# tool reads it there; vegetation slows a walker by TYPE, and canopy density
# (operator's ruling, 2026-10-20) narrows sweep width but no longer changes
# speed. New: `terrain.movement`, `planning.walking` (the walking ground the
# rings and hasty travel minutes share), `slope.slope_gradient`,
# `evt.codes_at_cells` and `evt.lifeform_of`. NUMBERS A CALLER SEES CHANGE:
# a hasty LINE candidate's `effort.rate_kmh` is Tobler at the on-way factor
# (was x0.8 for an assumed moderate density), so its hours fall by a fifth;
# a CORRIDOR's rate - and the debrief `terrain_metrics` traverse
# `vegetation_adjusted_rate_kmh` - is Tobler x 0.6 x the area-weighted
# lifeform factor (was x the density factor), so sweep times rise, most in
# brush; `travel_minutes_from_center` is the shared walk's (signed grade,
# trails, vegetation, water, closures - was cross-country Tobler with none
# of them), and is null with a warning on ground over 1,800 x 1,800 cells.
# Assumption shapes: `traverse.ASSUMPTIONS` loses `speed_factor_by_density`
# and gains `off_way_factor`, `speed_factor_by_lifeform` and
# `movement_model`; `assumptions.travel` is the walking rules plus a
# `movement` block (its `dem_void_m` and `tobler` keys become `dem_void` and
# `movement.tobler`); `assumptions.effort` and each candidate's shared
# effort assumptions gain `movement`; `travel_time_rings`' factors move under
# `assumptions.movement`. `site_facts` reads vegetation through the shared
# sampler: a cell centre exactly on the EVT raster's edge is now counted the
# way `floor` places it. `egress_routes` walk-out walks the same shared
# ground (vegetation, creeks, rivers, shores, open water, steep-ground
# closure; an exit's cells never closed), so walk-out minutes and routes
# change - slower and more on-trail through timber and brush, and an exit
# across an unbridged river is unreachable, its reason naming the water;
# walk-out results gain `assumptions.walking`, `assumptions.ground`, and
# the walking ground's warnings (no LANDFIRE, waterway kinds unknown).
# Carry-out keeps its litter factors and grade limit over ways alone and
# is unchanged but for the new `assumptions.ground` sentence. No fact field
# is removed; only assumption keys move.
# 0.22.0: a new tool, `nearest_medical_facilities` - the closest medical
# center, trauma center and pediatric trauma center to a point, each
# category ranked by ROAD time (OSRM), with a Markdown table of trauma level,
# helipad Y/N/unknown, road distance and time, air time where there is a
# helipad (straight line at 240 km/h plus 5 minutes), phone and address,
# and GeoJSON markers to draw. Hospitals from HIFLD (FEMA's copy; HIFLD Open
# is retired), helipads cross-checked against OpenStreetMap, campuses listed
# twice merged, and a children's hospital never counted as an adult trauma
# center. Stateless; two new optional settings, `ZA_HOSPITALS_URL` and
# `ZA_OSRM_URL`. Callers gain a tool; nothing existing changes.
# 0.22.1: staging asks Overpass for up to sixteen OSM tiles in ONE request
# instead of one request per tile. The wait on overpass-api.de is per
# request (a trivial query took 36 s on 2026-10-21), so a six-tile staging
# that sat through six waits now sits through one. Each tile is still cached
# in its own file, split back out by marker elements, so cache keys and
# results - route ids included - are unchanged. An answer Overpass marks as
# a runtime error, or one that does not hold every tile once, is refused
# rather than cached as complete. Nothing a caller reads changes.
# 0.23.0: `nearest_medical_facilities` fixes two things found in a live run.
# Its `markers` now import into CalTopo as Markers - `class`, `title`, a
# `description` holding the hospital's table row (categories and ranks,
# trauma, helipad, road and air time, phone, address, validation date),
# `marker-symbol` (`firstaid` red for a hospital, `point` blue for the
# point) and `marker-color`; before, CalTopo drew bare black dots with empty
# descriptions. `role`, `categories` and the other properties stay. And a
# point outside the US is now said to be: HIFLD is US-only, and downtown
# Vancouver was told its nearest trauma center was Bellingham, 87 km off. A
# new field `point.in_us` (true, false, or null when the check failed) and
# `point.us_state`, from the Census TIGERweb States layer - one more public
# call, overridable with the new optional `ZA_US_STATES_URL` - and a first
# warning when the point is in another country or offshore. A failed lookup
# is a warning. `assumptions.coverage` names the source. Nothing removed.
# 0.24.0: `lz_candidates` closes open water before fitting. A lake is flat
# and reads as bare on the canopy proxy, so a live run at an alpine lake
# graded the lake itself "preferred", 727 m across. Water is now closed
# from LANDFIRE open water (`evt.tif`, 30 m, so a little shore may close
# with it) and from OpenStreetMap lake, reservoir and coast shorelines, a
# closed ring filled; dry shore is still graded on its own. New
# `assumptions.water_sources_checked` ("landfire_open_water",
# "osm_shorelines"), and a warning when evt.tif cannot be read or neither
# source can. Candidates on water disappear; nothing is removed.
# 0.25.0: trees from true-colour imagery, as a shared building block
# (`terrain.trees`): `detect_trees` on any image (crowns, shadows, both) and
# `trees_on_grid`, the share of each staged cell that is tree or tree shadow
# from CalTopo's NAIP true colour (`n3`) at about 1 m. A shadow is dark and
# not green against its 60 m surroundings, or very dark at any colour; a
# crown is green within 6 m of one, so a wet meadow - as green as a pine but
# shadowless - stays open. `lz_candidates` closes every cell holding a tree
# or its shadow before fitting, with no speck rule: a live run offered a
# 50 m circle with a dozen pines in it, which the CIR proxy read as 3 %
# canopy and its speck rule fitted over. New `assumptions.trees` ("checked"
# / "not checked") and `assumptions.trees_method`; without a WMS token or
# when the imagery fails it is a warning, never a refusal. Fewer, cleaner
# candidates in timber; nothing removed.
# 0.26.0: a new tool, `unmarked_paths` - roads and trails on staged ground
# that OpenStreetMap has not got, from the Forest Service road (open and
# closed) and trail inventories, BLM GTLF, the National Map's trails, 4WD
# and closed roads, and DEM benches, fused into one ranked list. Agreement
# is counted by lineage, so a USGS copy of a Forest Service trail is one
# sighting. Written to `exports/unmarked-paths.geojson` for a planner to
# import into CalTopo as line Shapes - a file, never a write. Callers gain
# a tool. Also in 0.26.0, the DEM lineaments `shaded_relief` and
# `unmarked_paths` both read no longer drop a component that traces too
# winding along one axis - a road with spurs, a hairpin: it is split into
# its centreline branches at every junction, each judged on its own, and
# every lineament says `traced_by` "axis" or "centreline". On real ground
# this recovered a 1 km road network that was being dropped whole.
# scikit-image is declared for the skeleton; it was already installed, as
# a requirement of pysheds. Centreline arms that carry straight through a
# junction are joined back into one line; a bench that is mostly a mapped
# way now offers its unmapped stretches (`clipped_from_m`, `mapped_share`)
# instead of being dropped whole; and the CalTopo file holds every
# candidate by default (`geojson_limit`), not only the `limit` returned.
# Two more: NAIP aerial imagery (USGS National Map, public) is a source of
# its own - a line on a corridor barer than the ground either side gains an
# independent "imagery" sighting - and line ends are bridged to the nearest
# line or mapped way within 40 m along flat ground, where the bench fades
# at junctions; bridges are listed apart and drawn green.
# 0.27.0: the tools are split into three layers - components, features and
# scenarios - each a package with `register(mcp, ctx)` (docs/ARCHITECTURE.md).
# `server.py` now only builds a `ServerContext` (new `context.py`: the config,
# the map reader, the norms, `state()` and `staged()`) and registers each
# layer; `planning/tools.py` is gone, its wrappers moved word for word. Every
# tool carries its layer as a FastMCP tag. Callers see the same 37 tools with
# the same names, descriptions and schemas; only the tag is new. Tests now
# walk every tool's globals and lazy imports, not only the planning ones, and
# `tests/test_layering.py` enforces that imports point down the layers.
# 0.27.1: infra no longer imports domain, so the layering test's list of
# known exceptions is empty and forbids new ones. Which cached tiles staged
# ground rests on is worked out by `staging.tiles_in_use` (moved from
# `cache/evict.py`), and `plan_eviction`/`evict` now take those keys as a
# required `protected=` argument; the `evict_cache` tool wires the two.
# `find_assignment` moved from `caltopo/session.py` to
# `caltopo/assignment.py`, with no re-export, so importing or patching it by
# the old path now fails. The app still uses the old path and must switch to
# `sar_geo_mcp.caltopo.assignment.find_assignment` when it upgrades: the
# imports in `pipeline.py` and `cli.py`, its hub-contract test, and the
# `monkeypatch.setattr` targets in `test_cli_run.py`, `test_ui_server.py`
# and `test_ui_prepare.py` (on the old path these raise AttributeError
# before the test runs). The unused `session._label_of` is gone. The 37
# tools keep their names, descriptions, schemas and answers; no MCP caller
# sees a change.
# 0.27.2: every tool is a plain function first (rule 1 in
# docs/ARCHITECTURE.md), so a scenario can call features and components
# without MCP. Each tool's body moved, unchanged but for spelling out
# `ctx.staged`, `ctx.config` and the like, into a module-level function of
# the tool's own name in the same module, taking the `ServerContext` first
# and then the tool's arguments, and returning the payload an MCP caller
# gets - `sar_geo_mcp.features.lz.lz_candidates(ctx, handle, ...)`. The MCP
# wrapper keeps the description and signature, is named `_<tool>_tool` in
# the source and only calls the function. It is registered through the new
# `context.mcp_tool`, which passes `name=` and renames the wrapper to the
# tool's name, so an argument-validation error still says
# `call[lz_candidates]`, not `call[_lz_candidates_tool]`. The tool layers
# now import `context` for the type and for `mcp_tool`; the layering test
# allows that for them alone, and now also refuses `context` importing
# `server`. Callers see the same 37 tools with the same names, tags,
# descriptions, schemas, answers and error wording, and the patch targets
# tests use (`features.lz.lz_candidates_impl`, `context.resolve`) still
# take effect. Two changes reach only a direct caller, since the MCP path
# already behaved this way: `assignment_norms` returns a deep copy, so a
# scenario changing its payload cannot change the server's norms, and
# `planning.rasters.slope_shading` refuses an unknown `returns` with a
# ValueError, as `shaded_relief` does, where it used to answer as for
# "data". Not changed: any other tool's logic, any other domain or infra
# module, `server.py`. The registration test now walks the plain functions
# and the tool-layer helpers they call, nested code included, checks every
# `ctx.<name>` they read, and checks every tool's shape: the signature, that
# each argument reaches the parameter of its name, and the wrapper's name.
# 0.28.0: the first scenario, `plan_medevac` (tag `scenario`): a patient at a
# point, and in one call the landing zones nearest them, the 2WD and 4x4
# exits on foot and by litter, and the nearest hospitals and trauma centers.
# It stages two grounds centred on the patient through `prepare_area` - 1,000 m
# at 2 m for `lz_candidates`, 3,000 m at 10 m for `egress_routes` - and calls
# those two and `nearest_medical_facilities` as plain functions. It answers in
# sections, each with its own `status`, `error`, `warnings`, compact facts
# (points, never outlines or routes) and the exact `detail_call` that returns
# the full answer, kept on a section whose call raised; overall `status` is
# ok, partial or failed - failed only when nothing answered, so an egress with
# one mode back reads partial - and a section that fails (a staging, a
# lookup) never stops the others. `summary` holds the top-line facts -
# nearest landing zone of any grade and nearest preferred (or, when the
# limit left every preferred zone out, how many and the call that lists
# them), quickest exit per mode, nearest trauma center - and no verdict. One
# CalTopo-importable GeoJSON (patient, landing zones, routes, hospitals) is
# written to `exports/medevac.geojson` beside the staged ground, each marker
# saying what was not checked there; nothing is sent to CalTopo. `include`
# and `overrides` select sections and pass feature keywords, and bad ones
# are refused before any work: a radius exactly as `prepare_area` would
# refuse it (so 4,500 m, a hair over its 9,000 m across, is refused up
# front), a keyword a helper always sets, and an egress keyword whose
# default differs by mode while both modes run. The machinery every later
# scenario reuses - section status, those refusals, staging each ground
# once, the export, and one helper each for landing zones, egress, medical
# and parking - is in the new `scenarios/_sections.py`; docs/ARCHITECTURE.md
# describes it, and README lists the tool. Callers gain a tool; the 37
# existing tools keep byte-identical descriptions and input and output
# schemas, and no feature, component, domain or infra module changed.
# 0.29.0: the second scenario, `plan_initial_response` (tag `scenario`): the
# first operational period of a wilderness search from a place last seen, in
# one call - the hasty lines a team can run (`hasty_candidates`, 20 nearest by
# default), the nearest parking (`parking_candidates`), walking-time rings
# (`travel_time_rings`, 15, 30 and 60 minutes), the landing zones nearest the
# place (`lz_candidates`) and the nearest hospitals
# (`nearest_medical_facilities`), each a compact section with its own status
# and `detail_call`, and an `export` section that writes the hasty set as
# DRAFT CalTopo assignments through the `caltopo_export` component, with
# everything else found (the place, parking, ring outlines, landing zones,
# hospitals) in a second file, `exports/initial_response.geojson`. It stages
# up to three grounds centred on the place: the search area (`radius` with
# `radius_unit`, or `radius_m`; default 1,500 m) at the default raster, the
# rings' ground at 10 m sized for the longest ring by the rings tool's own
# rule on the model's quickest ground and capped at 4,499 m, and 1,000 m at
# 2 m for the landing zones - plan_medevac's default, so the two share it.
# `summary` holds counts per hasty kind and axis, the nearest parking, each
# ring's area and reach, the nearest landing zones and the nearest trauma
# center, and no verdict. The export never fails: every way it can draw
# nothing (hasty left out or failed, caltopo_export raising, a full disk, no
# ground to write beside) is a warning on its section, and the overall status
# leaves the export section out, so a full disk never reads as "partial";
# `include` naming only export is refused. Refused before any work, beside
# what plan_medevac refuses: bad ring times, a negative limit, a hasty
# `corridor_widths_m` override that is not one (a misspelt class included,
# which the model would silently ignore), a rings walking-model override the
# rings tool would refuse, an export `label_prefix` caltopo_export would
# refuse, and the export's own handle and set. `scenarios/_sections.py` gains
# the helpers for hasty, rings and the candidate-set export, those checks and
# the summary facts; `overall_status` leaves an `export` section out (none
# existed before), and the parking marker names its point; plan_medevac now
# uses the shared resolution constants, limit checks and facts instead of its
# own copies, with the same answers, wording and schema. Domain changes:
# `planning.travel_rings` makes its ring-time check public as `minutes_list`
# (it was `_minutes_list`), its radius rule `radius_to_fit` (with
# `reach_bound_m`) and its model `rings_model`, adds `fastest_factor` and
# `LARGEST_RADIUS_M`, and fixes three edge-warning bugs: for a 52.6-55
# minute ring it named radius_m=4,500, which prepare_area refuses (now 4,499,
# or "cannot be drawn whole" past it, which now says 4,499 m reaching 5,499 m
# rather than 4,500 and 5,500); with an off_way_factor or vegetation_factors
# override that made open ground quicker than a trail it named too small a
# radius and a false "no one walks farther than"; and an absurd time or
# speed_factor raised OverflowError instead of saying none fits. Other ring
# answers and wording are unchanged. `planning.export` makes its label-prefix
# rule public as `check_label_prefix` (same words), and no longer raises on a
# candidate whose bearing from the centre is null - a hasty line through the
# centre, as a trail is when the place last seen is its trailhead - which
# made `caltopo_export` fail for the whole set with a TypeError; it now says
# "0 m from the centre." with no bearing. Callers gain a tool; the 37
# original tools and plan_medevac keep byte-identical descriptions and input
# and output schemas, caltopo_export now exports such a set, and
# travel_time_rings' edge advice is right in the cases above. No other
# feature, component or infra module changed.
# 0.30.0: the third scenario, `plan_urban_search` (tag `scenario`): an urban
# or suburban search round a place last seen, in one call - the populated
# blocks grouped into assignments of about one size (the `urban` section:
# `populated_areas`, then `urban_assignments`, both keeping the blocks of
# the search circle), the nearest parking (`parking_candidates`) and the
# nearest hospitals (`nearest_medical_facilities`), each a compact section
# with its own status and `detail_call`, and an `export` section that writes
# the assignments as DRAFT CalTopo assignments through `caltopo_export` - in
# the scenario's `resource_type`, with house markers exactly when
# `building_markers` asked for them - and the place, parking and hospitals
# to `exports/urban_search.geojson`. It stages one ground at the default
# raster, `radius` with `radius_unit` or `radius_m`, default half a mile.
# Without the CalTopo WMS token the urban section fails in populated_areas'
# own words and the rest still answer. `summary` holds the assignment count,
# target and size spread, total area, lots and buildings, the nearest
# parking and the nearest trauma center, and no verdict. The urban section
# calls two features, so its overrides go by tool, `{"urban":
# {"populated_areas": {...}, "urban_assignments": {...}}}`, and a block rule
# given to populated_areas alone - urban_assignments takes none but
# `max_distance_m` - is said on the section, since the blocks counted are
# then not the ones grouped. The section also says when a `max_distance_m`
# override reaches past the search radius (lot lines are read over the
# staged circle only, so it adds at most blocks straddling the edge: a
# wider search needs a larger radius), and when a house-marker colour given
# to populated_areas is not the one the drafts take (urban_assignments').
# When urban_assignments raises after the blocks were drawn, the section
# fails but keeps `blocks`, and `answered_in_part` reads it as partial, as
# it does an egress whose other mode answered. A search radius under 50 m
# is answered with a top-level warning that `radius` is read in metres
# unless `radius_unit` says otherwise. Refused before any work, beside what
# the other scenarios refuse: a flat urban overrides mapping, a `target_ha`
# not above zero, a block rule out of range, a marker colour CalTopo cannot
# read (null included), and a radius too wide to read lot lines over
# (about 4,035 m, which prepare_area would still stage).
# `scenarios/_sections.py` gains `urban_section` and `urban_facts`,
# override checks by tool for a section that calls several features
# (`SECTION_PARTS`; `FEATURE_KEYWORDS` is now keyed by tool, not section),
# `set_export_section(settings=...)` for keywords a scenario sets from its
# own arguments (spread after the overrides, so they win), and
# `write_markers`, the second export file and its top-level warnings, moved
# out of plan_initial_response, which now calls it with the same answers,
# wording and schema. Domain changes: `planning.populated` makes its parameter
# checks public as `check_params` (it was `_validate`; same words) and adds
# `panel_pixel_m`, its width rule on its own, so a scenario refuses before
# staging what it would refuse after; and `planning.urban.group_blocks` no
# longer returns an empty outline for a group whose every block lies inside
# a larger group's outline - found by this step's live run on ground staged
# while Overpass was down, where lots grouped by adjacency alone made a
# 132 ha block round a small one and `urban_assignments` raised "max()
# iterable argument is empty". Such a group now joins the group drawn round
# it, its blocks counted there, as the module's rule that shared ground
# goes to the larger group says; any other grouping is unchanged. Callers
# gain a tool; the 37 original tools, plan_medevac and
# plan_initial_response keep byte-identical descriptions and input and
# output schemas, and urban_assignments answers where it used to raise. No
# other feature, component or infra module changed.
# 0.31.0: the fourth and last planned scenario, `debrief_assignment` (tag
# `scenario`): a team back from a CalTopo assignment, in one call. It stages
# the assignment (`map_id`, `label`, `public`) with the `prepare_terrain`
# component and answers three sections on its handle, in this order:
# `metrics` (`terrain_metrics` - elevation, slope, aspect, landform, each
# drainage's measurements, vegetation, walking rate and sweep width, the
# OpenStreetMap routes counted by type and named, the ways in, and the
# identified shapes counted by kind, with no outline), `coverage`
# (`coverage_for` with `track_names` - the coverage numbers, each track's
# summary, and each gap's size, the terrain shapes it leaves unsearched and
# a WGS84 point inside it, projected back from the Web Mercator outline
# coverage_for gives) and `features` (`identify_features` for `kinds`,
# default steep_band, drainage and cliff_band: per kind the count, the shape
# ids, the summary's single facts and the warnings). The metrics run first
# because they save the sweep width an area's coverage reads: when they
# fail, coverage of an area fails naming that failure (`DependencyFailed`);
# left out of `include`, coverage reads the metrics an earlier call saved,
# and with none saved an area's coverage fails saying to add "metrics" to
# include; a line's runs either way, with a warning saying which width. An
# assignment that cannot be staged fails every section with the reason.
# Each tool's `staleness` block is said once, at the top level (the
# latest), and a boundary that moved, or could not be checked, is warned
# of for every section that answered, since all stand on one staged
# ground. `summary` holds the ground's size, relief, slope, vegetation and
# sweep width, the covered fraction, effort, gap count, total and largest
# gap, and the count per feature kind, and no verdict. `exports` is always
# empty: a debrief draws nothing new. Refused before the map is read: a
# blank map id or label, track names that are not a list of names (or
# none while coverage is asked for), an unknown feature kind, and any
# override, since none of the three tools takes a keyword the scenario does
# not set itself. `scenarios/_sections.py` gains `stage_assignment`,
# `check_assignment`, `check_track_names`, `check_feature_kinds`,
# `assignment_kind`, `saved_metrics`, `metrics_section`, `coverage_section`,
# `features_section` and their facts, `gap_point`, `staleness_warnings`,
# `DependencyFailed` and `Outcome.staleness`; `ground_handle` names an
# assignment's ground by its label and map (an area's refusal reads as
# before), and a refused override for a tool that takes none says there is
# nothing to override rather than "it accepts []". Callers gain a tool; the
# 37 original tools and the three earlier scenarios keep byte-identical
# descriptions and input and output schemas, and no feature, component,
# domain or infra module changed.
# 0.31.1: the four scenarios aligned with one another and with the docs, after
# a review of the whole branch. `scenarios/_sections.py` gains `summarise`,
# the one `summary` builder every scenario now calls with its own `FACTS`
# mapping (three scenarios had a copy each, and plan_medevac its own), with
# `in_part` for a section read when it holds an answer in part;
# `egress_facts`, plan_medevac's quickest exit per mode moved there beside
# the other facts helpers; and `unused_overrides`, the "overrides[...] was
# not used" warning all four built for themselves. plan_medevac names each
# section's ground through a `SECTION_GROUND` mapping, as the others do.
# Answers, warnings and their wording are unchanged. Descriptions change
# for the four scenario tools only: plan_medevac's `handles` no longer
# offers `elevation_profile` "along an exit" - it takes a drainage id from
# terrain_metrics, not a route - and names egress_routes and
# travel_time_rings on the exit ground instead, and now says a section
# names its ground in `ground`; plan_initial_response says, as
# plan_urban_search does, that `markers_path` is null with no warning when
# nothing but the place last seen would be in it; and each scenario now
# says what its echoed subject (`patient`, `place_last_seen` and
# `radius_m`, `assignment`), its top-level `warnings` and its `note` are.
# README counts forty-one tools, names the scenarios and the layer tags,
# and points to the plain functions; docs/ARCHITECTURE.md no longer says
# egress is used by more than one scenario, and describes `summarise` and
# `unused_overrides`. Not changed: the 37 original tools' descriptions and
# input and output schemas (byte-identical), every scenario's input and
# output schema, and every feature, component, domain and infra module.
# 0.31.2: the scenarios check what they are given as the tools they call
# would. WHAT WAS WRONG: an override VALUE reached the feature function as
# given - `overrides` is an untyped mapping, so no schema read it on the way
# in - and a bad one (text for a number, a null slope, a hasty kind that is
# not one, a zero `min_length_m`, a 1,000 km hospital search) failed its
# section after the grounds were staged, often in Python's words; worse, a
# "false" string for a flag was truthy, so `{"export": {"include_area":
# "false"}}` drew the search area the caller left out, saying nothing, where
# caltopo_export called directly reads the same JSON as false. `radius_unit`
# beside `radius_m` was dropped, so `radius_m=2, radius_unit="km"` staged a
# 2 m circle and answered "ok". plan_initial_response said nothing of a
# search radius under 50 m (`radius=0.5`, half a mile with its unit left
# out), whose near-empty hasty section reads as "no hasty lines here". An
# urban `resource_type` the corpus has no median for (DOGS for DOG) was
# sized by the median of every assignment yet labelled "corpus median for
# DOGS", with no warning, and drafted as DOGS. WHAT CALLERS SEE NOW:
# `check_overrides` reads every override value as the feature tool's own
# schema does (pydantic adapters over the real functions' annotations): one
# it converts is passed on converted - "6" as 6.0, "false" as False - in the
# call and its `detail_call`, a whole number where a float goes kept as
# written; one it refuses, or the feature's own range checks would refuse
# (`hasty_params`; the checks of lz_candidates and
# nearest_medical_facilities, moved unchanged into new pure `check_params`
# in planning/lz.py and planning/medical.py; and a new `check_params` in
# planning/egress.py running egress's own `_settings` for every mode), is
# refused before anything is staged, naming the keyword. Stricter than the
# schema in one way: a number that is not finite ("nan", "inf") is refused,
# since NaN passes every range check and its section would answer "ok"
# with nothing found. The keywords a scenario check already reads in the
# domain's words (corridor widths, walking pace, label prefix, marker
# colour) are left to it - their text read by the schema first, so a pace
# of "0.5" is 0.5 - and a blank export `resource_type` is refused too.
# `radius_in_metres` refuses a unit other than metres beside `radius_m`,
# and an unknown unit even with no radius - in both scenarios and in
# prepare_area, whose description already says to give one form. Every
# scenario taking a `radius_unit` warns of a radius under 50 m through one
# helper, `small_radius_warnings` (SMALL_RADIUS_M moves to _sections;
# plan_urban_search's wording is unchanged). urban_assignments labels the
# fallback "corpus median of every assignment (none for DOGS)" and warns,
# naming the types the corpus knows, and a scenario's export section warns
# when drafts carry such a type (`resource_type_warnings`). Descriptions
# change for plan_medevac, plan_initial_response and plan_urban_search only,
# to say how override values are read, the small-radius warning and the
# resource-type fallback. NOT CHANGED: every tool's input and output
# schema, the 37 original tools' descriptions, and what a valid call
# answers - a known resource type, a radius of 50 m or more and good
# override values give the same answer as before.
# 0.31.3: a scenario's summary says "unknown", never "none", for a count
# whose input was missing. WHAT WAS WRONG: a feature with no input answers
# an empty list and a warning - parking_candidates and hasty_candidates on
# ground staged during an OpenStreetMap outage (no osm.json), parking also
# on ground fetched before it was asked for; identify_features' clearing
# without a vegetation panel (every prepare_terrain ground), route and
# ingress without osm.json. The sections kept the warning, but the summary
# - the facts read first, beside no warning - copied the empty answer as a
# none: parking `count` 0 with `nearest` null, documented as "none", and a
# hasty `by_axis` with no trail or road key, both byte-identical to ground
# where OpenStreetMap was read and maps nothing; a debrief's
# summary.features counted the unknown kind 0 while summary.metrics, in
# the same answer, gave the ways in as null. WHAT CALLERS SEE NOW: each
# count the summary copies is null when its input was missing, in the
# section and the summary alike. Parking: the section's
# `total_before_limit`, and the summary's `count` and
# `total_before_limit`, are null when no lots could be read (the feature's
# missing-osm.json warning, or a `query_version` below 3). Hasty: on
# ground with no osm.json each axis read from OpenStreetMap that was asked
# for - trail, road, waterway - is null in `by_axis`; in `by_kind`, `line`
# is null when trail or road was asked for, and `corridor` when waterway
# was the only corridor axis asked for; `total_before_limit`, and the
# summary's `count`, are null when no axis asked for could be read. The
# axes from the elevation model keep their counts, and a hasty count that
# read some axes counts those. Debrief: a kind whose input is missing has
# `count` null in its section and in summary.features. Each detector now
# declares the warnings it gives for a missing input
# (`FeatureDetector.missing_input_warnings`; `terrain.features.
# input_missing` reads them), so the scenario tells "unknown" from "none"
# by the detector's own declaration, not by parsing prose. Descriptions
# change for plan_initial_response, plan_urban_search and
# debrief_assignment only, to say when these counts are null and why.
# NOT CHANGED: every tool's input and output schema, the 37 original
# tools' descriptions and answers (identify_features, parking_candidates
# and hasty_candidates still give 0 beside their warning; list_feature_kinds
# does not list the new declaration), the export files, every count
# whose input was read - 0 there is still a real "none here" - and hasty's
# `existing_assignments`, still 0 with no map read (PR #4 review B43).
# 0.31.4: plan_medevac's CalTopo exit lines say the vehicle end. WHAT WAS
# WRONG: a route line - all a field team reads of an exit in CalTopo - said
# its minutes, "Exit on <road>" and a crossed-gate count above 0, and
# nothing else of where the vehicle meets the team: not a gate on the exit
# road itself, not a private road, not the lot an exit lies in or the road
# it opens onto. On ground staged before gates were read it said nothing of
# gates at all, though they are unknown there: for an exit in a lot with no
# road beside it only the egress answer's own warnings say so, and the
# line never heard them. A line silent about a gate reads as open.
# summary.egress.<mode> gave the quickest exit's kind, minutes and distance
# alone, so a gated private road read as one an ambulance can use. WHAT
# CALLERS SEE NOW: each line names the exit road (an unnamed one by its
# kind), or the lot and the road it opens onto (or says lots are unknown);
# the road's OpenStreetMap access, or that it is not tagged, which does not
# make it public; and always its gates: those crossed on the way, a gate on
# the stretch of the exit road the exit lies on (the one OpenStreetMap way
# `gate_on_road` was read for, within the staged ground) or none mapped
# there - never "none on the road" - with the road in beyond that stretch,
# or into a lot, said to be unchecked; or that gates (or road class, access
# and gates) are unknown, never none, from the warnings `egress_section`
# now hands each line. "0 gates" is never said. An exit at the patient
# itself, which has no line, puts the same on the patient's marker.
# summary.egress.<mode> adds the quickest exit's `road_name`,
# `road_access`, `gate_on_road` and `parking_lot`, exactly as the section
# gives them and with the section's nulls; its `gates_crossed` stays in the
# section, beside the warning that says when it is unknown. The
# plan_medevac description says all of it. NOT CHANGED: every tool's input
# and output schema, the 37 original tools' descriptions and answers
# (egress_routes included), the egress section's exits and warnings, and
# each line's title, colour, geometry and which exits are drawn.
